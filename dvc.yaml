stages:
  data_ingestion:
    cmd: python src/Mlflow_project/pipeline/st_01_data_ingestion.py
    deps:
      - src/Mlflow_project/pipeline/st_01_data_ingestion.py
      - config/config.yaml
    outs:
      - resources/data_ingestion/Brain_MRI_scan_images


  prepare_base_model:
    cmd: python src/Mlflow_project/pipeline/st_02_base_model.py
    deps:
      - src/Mlflow_project/pipeline/st_02_base_model.py
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES
      - WEIGHTS
      - LEARNING_RATE
    outs:
      - resources/prepare_base_model


  training:
    cmd: python src/Mlflow_project/pipeline/st_03_model_training.py
    deps:
      - src/Mlflow_project/pipeline/st_03_model_training.py
      - config/config.yaml
      - resources/data_ingestion/Brain_MRI_scan_images
      - resources/prepare_base_model
    params:
      - IMAGE_SIZE
      - EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
    outs:
      - resources/model_trainer/trained_model.h5


  evaluation:
    cmd: python src/Mlflow_project/pipeline/st_04_model_evaluation.py
    deps:
      - src/Mlflow_project/pipeline/st_04_model_evaluation.py
      - config/config.yaml
      - resources/data_ingestion/Brain_MRI_scan_images
      - resources/model_trainer/trained_model.h5
    params:
      - IMAGE_SIZE
      - BATCH_SIZE
    metrics:
    - scores.json:
        cache: false